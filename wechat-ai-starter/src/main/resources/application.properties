spring.application.name=wechat-ai-assistant
server.port=8081
spring.main.allow-circular-references=true

# 时区
spring.jackson.time-zone=Asia/Shanghai
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

logging.level.com.wechatai.session.mapper.RemindMapper=WARN
logging.level.com.wechatai.wechat.RemindScheduler=INFO
logging.level.com.wechatai.ai=DEBUG
logging.level.com.wechatai.common=DEBUG

# 文件上传限制
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=60MB

# MySQL（按环境修改）
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/wechat?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP 连接池调优（显式收敛，避免突发流量耗尽 MySQL 连接）
spring.datasource.hikari.pool-name=WechatAiHikariPool
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.auto-commit=true

# MyBatis
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.mapper-locations=classpath*:mapper/**/*.xml

# Redis（按环境修改）
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD}

# LLM（占位，后续实现时填写）
wechat.ai.llm.api-key=${WECHAT_AI_LLM_API_KEY}
wechat.ai.llm.base-url=https://api.deepseek.com/v1/chat/completions
wechat.ai.llm.model=deepseek-v4-pro

# 微信（占位）
# wechat.app-id=
# wechat.app-secret=
# wechat.token=
# wechat.aes-key=

# TTS 语音合成（阿里云百炼 DashScope WebSocket）
tts.api-key=${TTS_API_KEY}
tts.websocket-url=wss://ws-nk5uaeizxd8yli1r.cn-beijing.maas.aliyuncs.com/api-ws/v1/inference
tts.model=cosyvoice-v3-plus
tts.voice=longanhuan
# 语音文件输出目录（按日期分目录存储）
tts.storage-path=./TTS
# 用户音色偏好持久化文件路径
tts.voice-config-path=config/voice-preferences.json

# ===== Qwen-VL 多模态识别 =====
qwen-vl.api-key=${QWEN_VL_API_KEY}
qwen-vl.base-url=https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions
qwen-vl.model=qwen-vl-plus

# 百度翻译 API（百度AI开放平台 aiTextTranslate）
translate.api-key=${TRANSLATE_API_KEY}
translate.app-id=20260722002651838

# AI 生成的文档（txt 文件存储路径）
docgen.storage-path=./AItext

# 邮件发送（QQ 邮箱 SMTP）
spring.mail.host=smtp.qq.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# 本地文件存储
wechat.storage.local-path=./upload

# 微信登录状态持久化
wechat.login.store-path=./wechat-login/login-state.json

# ===== MCP 客户端（滴滴出行） =====
# 启用 MCP 客户端（需先获取 API Key，默认关闭）
mcp.didi.enabled=true
# API Key（从 https://mcp.didichuxing.com/ 注册获取）
mcp.didi.api-key=${MCP_DIDI_API_KEY}
# 调试阶段使用沙箱环境，正式切换为 false
mcp.didi.sandbox=true

# ===== MCP 客户端（文件系统） =====
# 启用后 filesystemAgent 才能真正读写文件（需本机 Node/npx 可用）
mcp.filesystem.enabled=true
mcp.filesystem.npx-path=D:/Nodejs/npx.cmd
mcp.filesystem.allowed-dir=./upload

# ===== MCP 客户端（麦当劳） =====
# 启用麦当劳 MCP（需先在 https://open.mcd.cn/mcp 生成 Token，默认关闭）
mcp.mcdonalds.enabled=true
# API Token（从麦当劳开放平台生成）
mcp.mcdonalds.api-key=${MCP_MCDONALDS_API_KEY}
# MCP Server 地址
mcp.mcdonalds.base-url=https://mcp.mcd.cn/mcp-servers/mcd-mcp

# ===== MCP 客户端（猎聘） =====
# 启用猎聘 MCP（需先在 liepin.com/mcp/server 生成凭证，默认关闭）
mcp.liepin.enabled=true
# 凭证（登录 liepin.com → 打开 liepin.com/mcp/server → 生成凭证 → 粘贴到这里）
mcp.liepin.credential=${MCP_LIEPIN_CREDENTIAL}
# MCP Server 地址（猎聘官方 MCP 端点）
mcp.liepin.base-url=https://open-agent.liepin.com/mcp/user

# ===== 多账号（多 Bot）配置 =====
# 启用后单账号 WechatConnectionManager 自动退位，由 WechatClientRegistry 接管
wechat.multi-account.enabled=true
# 启动时自动创建的 Bot 数量（已有持久化登录态的会优先恢复）
wechat.multi-account.initial-clients=0
# 单个 Bot 参数
wechat.client.max-count=20
wechat.client.heartbeat-interval-ms=3000
wechat.client.read-timeout-ms=35000
wechat.client.rebuild-after-failures=10
wechat.client.rebuild-after-duration-ms=300000
# 多账号登录状态存储目录（每 client 一个 JSON 文件）
wechat.login.store-directory=./wechat-login/clients
# 用户线程池空闲回收时间（30 分钟）
wechat.conversation.executor-idle-timeout-ms=1800000
# 消息幂等去重（Caffeine 缓存）
wechat.inbound.idempotency-ttl-minutes=60
wechat.inbound.idempotency-max-size=100000
browser.headless=false

# ===== 快递100查询工具 =====
# 是否启用快递查询功能
kuaidi100.enabled=true
# API Key（留空使用每日10次免费额度，配置后走专属额度）
kuaidi100.api-key=${KUAIDI100_API_KEY:}
# API 请求超时（秒）
kuaidi100.timeout-seconds=10

# ===== Browser Click 高级配置 =====
browser.network-idle-timeout=5000
browser.click-timeout=10000
browser.click-retry-count=1
browser.click-retry-delay=500
browser.click-wait-strategy=NETWORKIDLE
browser.max-click-candidates=20
browser.max-candidate-list-size=10
browser.overlay-dismiss-enabled=true
browser.search-iframes=true

# ===== Node 脚本通道（通用；联网搜索优先走 scripts/web-search.js）=====
node.scripts.enabled=true
node.executable=node
node.scripts.dir=./scripts
node.script-timeout-ms=20000

# ===== ReAct 超时看门狗 =====
# 单次工具调用超时（毫秒），超时后注入 error JSON 让 LLM 换策略
wechat.watchdog.tool-timeout-ms=60000
# 子 Agent 整轮超时（毫秒），深研/多步搜索用 3～5 分钟
wechat.watchdog.agent-timeout-ms=240000
# Bridge 总超时（毫秒），需 ≥ Agent 超时，超时后告知用户并释放线程
wechat.watchdog.bridge-timeout-ms=300000

# ========== Qdrant 向量库（云端） ==========
wechat.qdrant.url=https://bbd5f78f-5fd2-46ba-9a7d-28499a064502.eu-central-1-0.aws.cloud.qdrant.io:6333
wechat.qdrant.api-key=${WECHAT_QDRANT_API_KEY}
wechat.qdrant.collection=document_chunks
wechat.qdrant.vector-size=1024
# 云端不稳定时快速失败降级，避免拖垮整轮对话（原先 30s/60s）
wechat.qdrant.connect-timeout-sec=3
wechat.qdrant.read-timeout-sec=5

# ========== Embedding 模型（阿里云 DashScope text-embedding-v2） ==========
wechat.ai.embedding.api-key=${WECHAT_AI_EMBEDDING_API_KEY}
wechat.ai.embedding.base-url=https://dashscope.aliyuncs.com/api/v1/services/embeddings/text-embedding/text-embedding
wechat.ai.embedding.model=text-embedding-v3

# ========== RAG 参数 ==========
wechat.rag.chunk.max-chars=500
wechat.rag.chunk.overlap-chars=50
wechat.rag.retrieve.top-k=5
wechat.rag.retrieve.min-score=0.5

# ========== 行为路径自学习 ==========
wechat.proactive.enabled=true
# 热路径置信度阈值（conf > 此值直接复用工具链）
wechat.proactive.hot-threshold=0.75
# 向量检索最小相似度
wechat.proactive.min-similarity=0.6
# 检索 Top-K
wechat.proactive.retrieve-top-k=10
# Qdrant 独立 collection
wechat.proactive.qdrant.collection=behavior_paths

# ===== Actuator 健康检查 =====
# 仅暴露 health / info 两个只读端点；health 详情需鉴权后才返回（避免泄露内部组件状态）
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true

# ===== Caffeine 读缓存 =====
# Caffeine 已通过 wechat-ai-wechat 的传递依赖存在于 classpath，
# spring-boot-autoconfigure 检测到后自动装配 CaffeineCacheManager，无需新增 Maven 依赖。
# 仅用于缓存 MCP 工具定义（配置型、变化极少），不影响任何写/执行路径。
spring.cache.type=caffeine
spring.cache.cache-names=mcpTools
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=10m


