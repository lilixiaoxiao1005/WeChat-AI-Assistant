# =====================================================================
# Copy this file to application.properties and fill in real values.
# Secret/credential fields use environment-variable placeholders.
# (The committed application.properties references these via ${ENV}.)
# =====================================================================

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/wechat_ai?useSSL=false&serverTimezone=Asia/Shanghai
spring.datasource.username=YOUR_MYSQL_USER
spring.datasource.password=YOUR_MYSQL_PASSWORD

# Redis
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379
spring.data.redis.password=

# WeChat (fill from official platform)
wechat.app-id=YOUR_WECHAT_APPID
wechat.app-secret=YOUR_WECHAT_APPSECRET
wechat.token=YOUR_WECHAT_TOKEN
wechat.aes-key=YOUR_WECHAT_AESKEY

# LLM
wechat.ai.llm.api-key=YOUR_LLM_API_KEY
wechat.ai.llm.base-url=https://your-llm-base
wechat.ai.llm.model=your-model

# TTS (Aliyun DashScope)
tts.api-key=YOUR_TTS_API_KEY

# Qwen-VL
qwen-vl.api-key=YOUR_QWEN_VL_API_KEY

# Translate (Baidu)
translate.api-key=YOUR_TRANSLATE_API_KEY
translate.app-id=YOUR_TRANSLATE_APP_ID

# MCP - Didi
mcp.didi.api-key=YOUR_MCP_DIDI_API_KEY

# MCP - McDonalds
mcp.mcdonalds.api-key=YOUR_MCP_MCDONALDS_API_KEY

# MCP - Liepin
mcp.liepin.credential=YOUR_MCP_LIEPIN_CREDENTIAL

# Qdrant
wechat.qdrant.api-key=YOUR_QDRANT_API_KEY

# Embedding
wechat.ai.embedding.api-key=YOUR_EMBEDDING_API_KEY

# Mail (QQ SMTP)
spring.mail.username=YOUR_MAIL_USERNAME
spring.mail.password=YOUR_MAIL_PASSWORD

# Kuaidi100
kuaidi100.api-key=YOUR_KUAIDI100_API_KEY

# Filesystem MCP allowed directory
mcp.filesystem.allowed-dir=C:/path/allowed
